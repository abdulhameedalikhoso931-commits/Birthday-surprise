<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Anoo ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:linear-gradient(135deg,#ff6fa5,#8e44ff);
overflow:hidden;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
text-align:center;
}

.container{
z-index:2;
}

img{
width:220px;
height:220px;
border-radius:50%;
border:6px solid white;
object-fit:cover;
box-shadow:0 0 30px white;
animation:zoom 3s infinite alternate;
}

h1{
margin-top:20px;
font-size:42px;
text-shadow:0 0 20px white;
}

p{
font-size:22px;
margin-top:10px;
}

.balloon{
position:absolute;
bottom:-150px;
font-size:45px;
animation:float 10s linear infinite;
}

.heart{
position:absolute;
top:100%;
font-size:24px;
color:#ff1744;
animation:heart 8s linear infinite;
}

@keyframes float{
0%{
transform:translateY(0);
}
100%{
transform:translateY(-120vh);
}
}

@keyframes heart{
0%{
transform:translateY(0) scale(0.5);
opacity:1;
}
100%{
transform:translateY(-120vh) scale(1.5);
opacity:0;
}
}

@keyframes zoom{
from{
transform:scale(1);
}
to{
transform:scale(1.08);
}
}
</style>
</head>

<body>

<div class="container">

<img src="anoo.jpg">

<h1>🎂 Happy Birthday Anoo ❤️</h1>

<p>May Allah bless you with happiness,<br>
success and endless smiles. 🌹💖</p>

</div>

<script>

for(let i=0;i<20;i++){

let b=document.createElement("div");

b.className="balloon";

b.innerHTML=["🎈","🎉","🎈","🎊"][Math.floor(Math.random()*4)];

b.style.left=Math.random()*100+"vw";

b.style.animationDuration=(6+Math.random()*6)+"s";

document.body.appendChild(b);

}

for(let i=0;i<40;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(4+Math.random()*6)+"s";

document.body.appendChild(h);

}

</script>

</body>
</html>
