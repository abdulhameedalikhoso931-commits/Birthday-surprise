<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Anoo ❤️</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff4b91,#6a5cff);
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#fff;
text-align:center;
}

.card{
background:rgba(255,255,255,.12);
padding:25px;
border-radius:20px;
backdrop-filter:blur(10px);
width:90%;
max-width:360px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

img{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
border:4px solid #fff;
margin-bottom:15px;
}

button{
padding:12px 22px;
border:none;
border-radius:30px;
background:#ff006e;
color:#fff;
font-size:18px;
cursor:pointer;
}

#msg{
margin-top:20px;
display:none;
font-size:17px;
line-height:1.6;
}

.heart{
position:absolute;
font-size:24px;
animation:fall 8s linear infinite;
}

@keyframes fall{
0%{transform:translateY(-100px);}
100%{transform:translateY(110vh);}
}
</style>
</head>

<body>

<div class="card">

<img src="PASTE_IMAGE_LINK_HERE">

<h1>🎉 Happy Birthday 🎉</h1>
<h2>❤️ Anoo Meri Jaan ❤️</h2>

<button onclick="showMsg()">💌 Click Here My Love 💌</button>

<div id="msg">
❤️ Happyyyy Birthdayyyy Anoo Meri Jaan! 🥹🎂💖<br><br>

May Allah bless you with endless happiness, good health and a beautiful life. 🌸🤲❤️<br><br>

Your smile makes my day brighter. 😊💖<br>
Stay happy, stay safe and always keep smiling. 🫂❤️<br><br>

Love You Forever ❤️♾️🥹
</div>

</div>

<script>

function showMsg(){
document.getElementById("msg").style.display="block";
}

setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"%";
h.style.animationDuration=(4+Math.random()*4)+"s";
document.body.appendChild(h);
setTimeout(()=>h.remove(),8000);
},300);

</script>

</body>
</html>
